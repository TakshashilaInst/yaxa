  outcomes: Be able to identify key growth drivers of the economy. To gain an appreciation of the role
    of ideas and institutions in economic progress and economic failure. Understand the meaning of economy
    and knowledge management. Gain an understanding to countries that have experienced high growth over
    a period of time. Understand relevance of growth diagnostics instead of growth theory.
