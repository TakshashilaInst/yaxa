code: GCPP102
title: Economic Reasoning and Public Policy
kb: GCPP102
description: This module concerns the application of economic reasoning to the design, implementation
  and outcome evaluation of public policies in India. The module will first provide an overview of analytical
  insights and international experiences on factors contributing to sustained high long-term economic
  growth. It will then introduce the basic concepts of demand and supply, and how these can be used to
  analyse such policies as price controls, minimum wage, import and export duties, subsidies and others.
  The key point which would be emphasised is the need to maintain a reasonable balance between demand
  and supply in a dynamic context. The module will then discuss the primary socio-economic function of
  public sector enterprises and organisations involved in providing basic amenities and services, su
