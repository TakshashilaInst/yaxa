code: TP-AI
title: Politics and Policy in the AI Age
kb: TP
description: Technology and Policy specialisation. How AI and networked technologies change politics, the economy
  and national power.
units:
- id: U01
  title: Introduction to Politics and Policy in the AI Age
  outcomes: Radically networked societies, information cascades, moral panics and how technology reshapes political
    power and protest.
- id: U02
  title: AI Diffusion and its Impact on the Economy
  outcomes: The macroeconomics of AI, task-based adoption, effects on jobs and retraining, and why transformative
    AI is hard to achieve.
- id: U03
  title: AI and National Power
  outcomes: How AI changes the sources of national power and the geopolitics of AI.
