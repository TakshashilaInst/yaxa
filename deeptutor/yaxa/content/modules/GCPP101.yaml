code: GCPP101
title: Introductory Public Policy Analysis
kb: GCPP101
description: Politics and public policy are intricately linked in a democracy. Policies which are enacted
  always foreshadowed by politics and reflect the inherent interests and compromises of the different
  stakeholders. The primary goal of this module is to develop an understanding of the policy process in
  the context of politics. This module covers the analysis, design, evaluation and marketing of public
  policies in India. The first half of the course will deal with understanding the policy environment,
  limitations of the government, decision-making models, narratives and approaches to effect policy change.
  The second half covers policy assessment, evaluation, and analytical methods with emphasis on data driven
  policy making.
units:
- id: U01
  title: Nations, States and Governments
  outcomes: 1. Understand the fundamental concepts in politics – distinguishing nations, states & governments.
    Students should be able to use these terms precisely. 2. Explore the ideas of the Indian nation. 3.
    Explore theories of the origin and purpose of the state. 4. Understand India’s system of government
    5. Compare and contrast the concepts of nation, state and government in India to that of other countries.
- id: U02
  title: Limitations of the Policymaker
  outcomes: 1. Understand the fundamental limitations in human mental processes. 2. Difficulties of perception
    and challenges of memory 3. Awareness of cognitive biases 4. The need to approach policy challenges
    with humility, dispassion, lack of certitude and rely on empiricism.
- id: U03
  title: Limitations of Government
  outcomes: 1. Appreciate the fundamental limitations of government as an agent 2. Understand the concepts
    of principal-agent problem, asymmetric information, moral hazard, time factor and scaling and how
    they lead to unintended consequences. 3. In India, the Republic’s social mission, contested information,
    time dynamics, scaling and the governance gap impose additional limitations on the Indian government.
- id: U04
  title: Decision-making in Government
  outcomes: 1. Appreciate the complexity of decision-making in government 2. Understand how policy agenda
    are shaped 3. Understand a few models of governmental decision-making
- id: U05
  title: Policy Writing
  outcomes: 1. Explore the nuances of structure, content, opinion, argument and language. 2. Understand
    the differences in writing an assignment, blog, opinion piece or article and a policy brief. 3. Understand
    the technical aspects of footnoting, references and plagiarism. 4. Delve into “evidence based writing”
    and how to structure a policy brief.
- id: U06
  title: Political and Policy Narratives
  outcomes: 1. Understanding narratives and their importance 2. Exploring the major political narratives
    in India 3. Constructing policy narratives by understanding some important archetypes
- id: U07
  title: Effecting Policy Change
  outcomes: 1. Analyse the strategies of effecting change 2. Understand how to manage change in the public
    sector 3. How to write a policy paper
- id: U08
  title: Basic statistical methods for policy decision making
  outcomes: 1. Understand fundamental concepts of statistics – such as data, sampling, frequency tables,
    etc. 2. Understand commonly used measures of central tendency (such as mean, median, mode) and measures
    of variation (range, standard deviation, variance, etc.) 3. Get a basic understanding of the concept
    of sampling and estimation by means of surveys. 4. Understand basic techniques of bivariate analysis
    such as correlation and regression
- id: U09
  title: A structured process for data-driven policy decision making
  outcomes: 1. Given a problem, you can use data-intensive methods in order to solve it 2. You understand
    how to frame the problem, and how to break down the problem into sub-problems which can each be solved
    using available data 3. You can frame hypotheses, and be able to collect data that will help you prove
    or disprove those hypotheses 4. Given data, you know how to clean and process it to get it into a
    usable format. And then, you can use the data to test the hypotheses. 5. After you have tested the
    hypotheses, you can stitch up the results in order to answer your question.
- id: U10
  title: Common pitfalls in data-driven policy decision-making
  outcomes: Understand that it is easy to make mistakes while handling data
