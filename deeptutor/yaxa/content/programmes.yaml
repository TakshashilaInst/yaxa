# Programme -> (optional) Track -> Modules -> Units.
# Modules are defined once in modules/<CODE>.yaml and referenced by code.
# A module code listed here without a modules/<CODE>.yaml file shows as "coming soon".
programmes:
  - code: GCPP
    name: Graduate Certificate in Public Policy
    summary: Twelve weeks, online, for working professionals. Five weeks of core modules shared by every track, then seven weeks of specialisation.
    tracks:
      - code: APP
        name: Advanced Public Policy
        core: [GCPP-Fundamentals, GCPP-ER1, GCPP-COMM]
        specialisation: [APP-PAF, APP-ER2, APP-CS]
      - code: TP
        name: Technology and Policy
        core: [GCPP-Fundamentals, GCPP-ER1, GCPP-COMM]
        specialisation: [TP-AI, TP-RS, TP-IE, TP-HTG]
      - code: DFA
        name: Defence and Foreign Affairs
        core: [GCPP-Fundamentals, GCPP-ER1, GCPP-COMM]
        specialisation: [DFA-SSIR, DFA-AS, DFA-SE]

  - code: PGP
    name: Postgraduate Programme in Public Policy
    summary: Takshashila's long-form programme. Modules coming soon.
    modules: []

  - code: CAPSULE-PF
    name: "Expert Capsule: Public Finance"
    summary: A short course on how the Indian state raises and spends money.
    modules: [GCPP173]

# Display names for modules that don't have a content file yet.
placeholders: {}
