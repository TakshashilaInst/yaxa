# Programme -> (optional) Track -> Modules -> Units.
# Modules are defined once in modules/<CODE>.yaml and referenced by code.
# A module code listed here without a modules/<CODE>.yaml file shows as "coming soon".
programmes:
  - code: GCPP
    name: Graduate Certificate in Public Policy
    summary: Twelve weeks, online, for working professionals. Core policy modules, then a specialisation track.
    tracks:
      - code: TP
        name: Technology and Policy
        core: [GCPP101, GCPP102, GCPP103]
        specialisation: [GCPP-TP-AI, GCPP-TP-RS, GCPP-TP-IE, GCPP-TP-HTG]
      - code: PP
        name: Public Policy
        core: [GCPP101, GCPP102, GCPP103]
        specialisation: [GCPP173]

  - code: PGP
    name: Postgraduate Programme in Public Policy
    summary: Takshashila's long-form programme. Module list to be confirmed.
    modules: [GCPP101, GCPP102, GCPP173]

  - code: CAPSULE-PF
    name: "Expert Capsule: Public Finance"
    summary: A short course on how the Indian state raises and spends money.
    modules: [GCPP173]

# Display names for modules that don't have a content file yet.
placeholders:
  GCPP103: Effective Communication and Media Engagement
  GCPP-TP-AI: Politics and Policy in the AI Age
  GCPP-TP-RS: Responsible Strategy
  GCPP-TP-IE: Information Economics
  GCPP-TP-HTG: High-Tech Geopolitics
